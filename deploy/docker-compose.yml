# Shinsou sync server + PostgreSQL + Caddy (automatic HTTPS).
#
#   cp .env.example .env     # set SHINSOU_DOMAIN and POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose logs server | grep setup_code    # one-time administrator setup code
#
# Full guide: docs/deploy/self-hosting.md
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shinsou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shinsou
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinsou -d shinsou"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [shinsou]

  server:
    build:
      context: ..
      args:
        VERSION: ${SHINSOU_VERSION:-dev}
    image: shinsou-sync-server:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SHINSOU_DATABASE_URL: postgres://shinsou:${POSTGRES_PASSWORD}@db:5432/shinsou?sslmode=disable
      SHINSOU_LISTEN: 0.0.0.0:8080
      SHINSOU_PUBLIC_URL: https://${SHINSOU_DOMAIN:?set SHINSOU_DOMAIN in .env}
      # Caddy is the only thing that reaches the server; trust its X-Forwarded-For.
      SHINSOU_TRUSTED_PROXIES: 172.30.42.0/24
      SHINSOU_REGISTRATION: ${SHINSOU_REGISTRATION:-invite}
      SHINSOU_EMAIL_VERIFICATION: ${SHINSOU_EMAIL_VERIFICATION:-}
      SHINSOU_INSTANCE_NAME: ${SHINSOU_INSTANCE_NAME:-Shinsou Sync}
      SHINSOU_RECORD_QUOTA: ${SHINSOU_RECORD_QUOTA:-200000}
      SHINSOU_SHARING: ${SHINSOU_SHARING:-enabled}
      SHINSOU_SHARES_PER_DAY: ${SHINSOU_SHARES_PER_DAY:-200}
      SHINSOU_REVIEWS: ${SHINSOU_REVIEWS:-enabled}
      SHINSOU_VISITOR_BROWSING: ${SHINSOU_VISITOR_BROWSING:-disabled}
      SHINSOU_REVIEWS_PER_DAY: ${SHINSOU_REVIEWS_PER_DAY:-30}
      SHINSOU_REPORTS_PER_DAY: ${SHINSOU_REPORTS_PER_DAY:-20}
      SHINSOU_NEW_ACCOUNT_AGE: ${SHINSOU_NEW_ACCOUNT_AGE:-72h}
      SHINSOU_NEW_ACCOUNT_POSTS_PER_DAY: ${SHINSOU_NEW_ACCOUNT_POSTS_PER_DAY:-5}
      # Mail (verification, password reset). Leave SHINSOU_SMTP_HOST empty to run without mail.
      SHINSOU_SMTP_HOST: ${SHINSOU_SMTP_HOST:-}
      SHINSOU_SMTP_PORT: ${SHINSOU_SMTP_PORT:-587}
      SHINSOU_SMTP_USERNAME: ${SHINSOU_SMTP_USERNAME:-}
      SHINSOU_SMTP_PASSWORD: ${SHINSOU_SMTP_PASSWORD:-}
      SHINSOU_SMTP_FROM: ${SHINSOU_SMTP_FROM:-}
      SHINSOU_SMTP_TLS: ${SHINSOU_SMTP_TLS:-starttls}
    networks: [shinsou]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    environment:
      SHINSOU_DOMAIN: ${SHINSOU_DOMAIN}
    ports:
      - "${SHINSOU_HTTP_PORT:-80}:80"
      - "${SHINSOU_HTTPS_PORT:-443}:443"
      - "${SHINSOU_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [shinsou]

networks:
  shinsou:
    ipam:
      config:
        - subnet: 172.30.42.0/24

volumes:
  db-data:
  caddy-data:
  caddy-config:
