openapi: 3.1.0
info:
  title: Shinsou Sync API
  version: 1.0.0-draft
  summary: Account, device and metadata sync API for Shinsou X.
  license:
    name: MIT
    identifier: MIT
  description: |
    Instance discovery, accounts, devices and sync, plus what the web front end needs: cookie
    sessions, a read-only library view, account export and deletion, email verification,
    password reset and the administration endpoints. Sharing and reviews are added in later
    phases.

    While the instance requires a verified email address, an account without one (administrators
    excepted) gets 403 `email_unverified` from the sync and library endpoints.

    Merge rules: docs/spec/sync-semantics.md. Work identity: docs/spec/work-key.md.
    Record fields: docs/spec/records.md.

    Every request from the app sends `Shinsou-Api-Version: 1`. A server that cannot serve that
    version answers 426 with error code `unsupported_api_version`.

servers:
  - url: https://sync.example.com

tags:
  - name: instance
  - name: auth
  - name: account
  - name: devices
  - name: sync
  - name: web
  - name: library
  - name: admin

security:
  - bearer: []

paths:
  /.well-known/shinsou:
    get:
      tags: [instance]
      operationId: getInstance
      security: []
      summary: Instance information shown before sign-in.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }

  /healthz:
    get:
      tags: [instance]
      operationId: health
      security: []
      responses:
        '200':
          description: The server and its database are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and this device signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
      description: |
        Registration policy comes from the instance (`registration`): `open`, `invite` (an
        `inviteCode` is required, else 403 `invite_required`) or `closed` (403
        `registration_closed`). A valid `setupCode` always works and makes the account an
        administrator; it can be used once. Usernames are lowercase `[a-z0-9_]{3,32}`; logins
        match them case-insensitively. 409 is `username_taken` or `email_taken`.

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in; a new device record was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      description: |
        Rotates the refresh token. Reusing an already rotated token revokes the whole device
        session and answers 401 `refresh_token_reused`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      description: Signs out the calling device and revokes its refresh token.
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/me/password:
    post:
      tags: [auth]
      operationId: changePassword
      description: Changes the password and signs out every other device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 256 }
      responses:
        '204': { description: Changed. }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [devices]
      operationId: renameDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [devices]
      operationId: signOutDevice
      responses:
        '204': { description: The device is signed out. }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      description: |
        Merges a batch of records inside one transaction. At most 500 records, 500 works and 1 MiB
        per request (413 `payload_too_large`). Records are merged one by one; a rejected record
        does not fail the batch. Resending the same `batchId` within 24 hours returns the stored
        response without merging again.

        Work descriptors in `works` are validated first and fail the whole request: 422
        `invalid_work_key` or `work_hash_mismatch`. A record keyed by a work hash needs its work
        in `works` or already on the server, else it is rejected with `rejected:unknown_work`.
        A `unit` record must carry `work` and `unitRemoteId`; the server recomputes the key and
        rejects the record with `rejected:invalid_key` when it differs.

        `since` is the client's pull cursor. A non-zero `since` below the account's tombstone
        floor answers 410 `resync_required` and nothing is merged. `since: 0` is always accepted.
        Pushes are limited per account (429 `rate_limited`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequest' }
      responses:
        '200':
          description: Per-record outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/sync/changes:
    get:
      tags: [sync]
      operationId: syncChanges
      description: |
        Full record states with `seq > since`, ascending. Pages hold at most 500 records;
        `nextSince` is the seq of the last record returned (or `since` when there are none).
        A non-zero `since` below the tombstone floor answers 410; `since=0` always works and is
        how a client recovers from 410.
      parameters:
        - name: since
          in: query
          required: true
          description: Exclusive. 0 pulls everything.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
      responses:
        '200':
          description: Records with seq > since, ascending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangesResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '410':
          description: since is older than the tombstone floor; pull again from 0.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/sync/stream:
    get:
      tags: [sync]
      operationId: syncStream
      description: |
        WebSocket upgrade, or `text/event-stream` when the client sends
        `Accept: text/event-stream`. The server only sends `{"seq": <latest>}` messages; clients
        pull /sync/changes when the value is greater than their cursor. Browsers that cannot set
        headers pass the access token as the `Sec-WebSocket-Protocol` value `bearer.<token>`;
        the server echoes that value as the chosen subprotocol. The server sends the current
        `{"seq": N}` right after connecting, then again whenever a push changes the account.
        The connection ends when the device is signed out. Access tokens are checked once when
        the stream opens.
      responses:
        '101': { description: WebSocket established. }
        '200':
          description: Server-sent events.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      security: []
      description: Confirms an email address with the token from the verification mail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Verified. }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      security: []
      description: |
        Sends a password reset mail when the address belongs to an account. The answer is the
        same whether or not it does. 409 `email_unavailable` when the server has no SMTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: Accepted. }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      security: []
      description: Sets a new password with the token from the reset mail and signs out every device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 256 }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/email:
    put:
      tags: [account]
      operationId: changeEmail
      description: |
        Sets, changes or removes (`null`) the email address. A new address starts unverified and,
        when the server can send mail and verification is not disabled, receives a verification
        mail. Removing the address is refused with `email_required` when verification is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, currentPassword]
              properties:
                email: { type: [string, 'null'], format: email }
                currentPassword: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/email/verification:
    post:
      tags: [account]
      operationId: resendVerification
      description: Sends the verification mail again. Limited to one mail per minute per account.
      responses:
        '204': { description: Sent. }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/me/usage:
    get:
      tags: [account]
      operationId: getUsage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/me/export:
    get:
      tags: [account]
      operationId: exportAccount
      description: Everything the server stores for the account, as one JSON download.
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
              description: '`attachment; filename="shinsou-export-<username>-<yyyymmdd>.json"`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExport' }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/me/delete:
    post:
      tags: [account]
      operationId: deleteAccount
      description: |
        Permanently deletes the account with its devices and synced records. The only
        administrator cannot delete itself (`last_admin`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/web/register:
    post:
      tags: [web]
      operationId: webRegister
      security: []
      description: |
        Registration for the web front end. Same rules as `/auth/register`; the device is created
        with platform `web`. The refresh token is not in the body: it is set as the HttpOnly
        cookie `shinsou_refresh` (SameSite=Lax, Path=/api/v1/web), together with the readable
        cookie `shinsou_csrf` (Path=/).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebRegisterRequest' }
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSession' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/web/login:
    post:
      tags: [web]
      operationId: webLogin
      security: []
      description: Sign-in for the web front end. Sets the same cookies as `/web/register`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebLoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSession' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/web/refresh:
    post:
      tags: [web]
      operationId: webRefresh
      security: []
      description: |
        Exchanges the `shinsou_refresh` cookie for a new access token and rotates both cookies.
        Requires the header `X-CSRF-Token` with the value of the `shinsou_csrf` cookie, otherwise
        403 `csrf_failed`. Requests must not run concurrently: a rotated cookie that is presented
        again signs the browser out (`refresh_token_reused`).
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebTokens' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/web/logout:
    post:
      tags: [web]
      operationId: webLogout
      security: []
      description: |
        Signs the browser out and clears both cookies. Requires `X-CSRF-Token` when a
        `shinsou_refresh` cookie is present. Always answers 204 once the CSRF check passes.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Signed out. }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/library:
    get:
      tags: [library]
      operationId: listLibrary
      description: |
        Read-only view of the synced library for the web front end. 403 `email_unverified` while
        the server requires a verified email address and the account has none.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Case-insensitive match on title and author. }
        - { name: category, in: query, schema: { type: string }, description: Category key; `default` selects entries without a category. }
        - { name: archived, in: query, schema: { type: string, enum: [exclude, include, only], default: exclude } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, title, added], default: recent } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryPage' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/library/{key}:
    get:
      tags: [library]
      operationId: getLibraryEntry
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, description: Library record key (`<workHash>` or `local:<uuid>`). }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/categories:
    get:
      tags: [library]
      operationId: listCategories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/admin/overview:
    get:
      tags: [admin]
      operationId: adminOverview
      description: Administrators only, like every `/admin` endpoint (403 `forbidden` otherwise).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Matches username or email. }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/admin/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [admin]
      operationId: adminUpdateUser
      description: |
        Changes role, status, record quota or the verified flag. Suspending signs the user out
        everywhere. The last active administrator cannot be demoted or suspended (`last_admin`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: adminDeleteUser
      description: Permanently deletes the account. Refused for the last active administrator.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/admin/users/{userId}/sign-out:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      operationId: adminSignOutUser
      description: Signs the user out on every device.
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/admin/invites:
    get:
      tags: [admin]
      operationId: adminListInvites
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      operationId: adminCreateInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxUses: { type: integer, minimum: 1, maximum: 1000, default: 1 }
                expiresInHours: { type: [integer, 'null'], minimum: 1, maximum: 8760 }
                note: { type: [string, 'null'], maxLength: 200 }
      responses:
        '201':
          description: Created. The plain code is only returned here.
          content:
            application/json:
              schema:
                type: object
                required: [invite, code]
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
                  code: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/admin/invites/{inviteId}:
    parameters:
      - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [admin]
      operationId: adminDeleteInvite
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/admin/settings:
    get:
      tags: [admin]
      operationId: adminGetSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      tags: [admin]
      operationId: adminUpdateSettings
      description: |
        Overrides instance settings at runtime. Environment variables provide the defaults; a
        value stored here wins until it is reset by sending `null` for that key. Setting
        `emailVerification` to `required` needs SMTP (`email_unavailable` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceSettingsPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: adminListAudit
      description: Administrative actions, newest first.
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: Value of the `shinsou_csrf` cookie.

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code; message is for humans and may change.
              enum:
                - bad_request
                - unauthorized
                - invalid_credentials
                - refresh_token_reused
                - forbidden
                - registration_closed
                - invite_required
                - email_unverified
                - email_required
                - email_unavailable
                - invalid_token
                - csrf_failed
                - last_admin
                - not_found
                - username_taken
                - email_taken
                - conflict
                - validation_failed
                - invalid_work_key
                - work_hash_mismatch
                - payload_too_large
                - quota_exceeded
                - rate_limited
                - resync_required
                - unsupported_api_version
                - internal
            message: { type: string }
            retryAfterSeconds: { type: integer }

    Instance:
      type: object
      required: [name, version, apiVersions, registration, emailVerification, features]
      properties:
        name: { type: string }
        description: { type: string }
        version: { type: string, description: Server software version. }
        apiVersions:
          type: object
          required: [min, max]
          properties:
            min: { type: integer }
            max: { type: integer }
        registration: { type: string, enum: [open, invite, closed] }
        emailVerification: { type: string, enum: [disabled, optional, required] }
        termsUrl: { type: [string, 'null'], format: uri }
        privacyUrl: { type: [string, 'null'], format: uri }
        contact: { type: [string, 'null'] }
        setupPending:
          type: boolean
          description: True while the instance has no administrator; registering with the setup code creates one.
        features:
          type: object
          required: [sharing, reviews]
          properties:
            sharing: { type: boolean }
            reviews: { type: boolean }
            email: { type: boolean, description: True when the server can send mail (verification, password reset). }

    DeviceInfo:
      type: object
      required: [name, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        platform: { type: string, enum: [android, ios, desktop, web] }
        appVersion: { type: string, maxLength: 64 }

    RegisterRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string, pattern: '^[a-z0-9_]{3,32}$' }
        password: { type: string, minLength: 8, maxLength: 256 }
        email: { type: [string, 'null'], format: email }
        inviteCode: { type: [string, 'null'] }
        setupCode:
          type: [string, 'null']
          description: One-time code printed by the server on first start; makes this account the administrator.
        device: { $ref: '#/components/schemas/DeviceInfo' }

    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string }
        password: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo' }

    Tokens:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken]
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: integer, format: int64, description: Unix milliseconds. }
        refreshToken: { type: string }

    Session:
      allOf:
        - $ref: '#/components/schemas/Tokens'
        - type: object
          required: [user, device]
          properties:
            user: { $ref: '#/components/schemas/User' }
            device: { $ref: '#/components/schemas/Device' }

    User:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        handle:
          type: string
          description: '`@username@host`, reserved for future federation.'
        email: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        role: { type: string, enum: [user, moderator, admin] }
        createdAt: { type: integer, format: int64 }

    Device:
      type: object
      required: [id, syncDeviceId, name, platform, createdAt, lastSeenAt, current]
      properties:
        id: { type: string, format: uuid }
        syncDeviceId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          description: The device id to use inside HLC timestamps. Unique within the account.
        name: { type: string }
        platform: { type: string }
        appVersion: { type: [string, 'null'] }
        createdAt: { type: integer, format: int64 }
        lastSeenAt: { type: integer, format: int64 }
        current: { type: boolean, description: True for the device making the request. }

    Hlc:
      type: string
      pattern: '^(0|[1-9][0-9]{0,15}):(0|[1-9][0-9]{0,9}):[A-Za-z0-9_-]{1,64}$'

    RecordKind:
      type: string
      enum: [library, unit, progress, history, category, repository, setting]

    DeletedRegister:
      type: object
      required: [value, clock]
      properties:
        value: { type: boolean }
        clock: { $ref: '#/components/schemas/Hlc' }

    WorkDescriptor:
      type: object
      required: [keyVersion, packageId, sourceId, remoteId, hash, title, contentKind]
      properties:
        keyVersion: { type: integer, const: 1 }
        packageId: { type: string }
        sourceId: { type: string }
        remoteId: { type: string }
        hash: { type: string, pattern: '^[0-9a-f]{64}$' }
        title: { type: string, minLength: 1, maxLength: 512 }
        author: { type: [string, 'null'] }
        coverUrl: { type: [string, 'null'], format: uri }
        contentKind: { type: string, enum: [manga, novel] }
        language: { type: [string, 'null'] }
        sourceName: { type: [string, 'null'] }
        repositoryUrl: { type: [string, 'null'], format: uri }

    PushRecord:
      type: object
      required: [kind, key]
      properties:
        kind: { $ref: '#/components/schemas/RecordKind' }
        key: { type: string, maxLength: 2048 }
        work:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Required for `unit` records; the parent work hash.
        unitRemoteId:
          type: string
          description: Required for `unit` records; the server recomputes `key` from it.
        fields:
          type: object
          additionalProperties: true
        clocks:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Hlc' }
        deleted: { $ref: '#/components/schemas/DeletedRegister' }

    PushRequest:
      type: object
      required: [batchId, since, records]
      properties:
        batchId: { type: string, format: uuid }
        since:
          type: integer
          format: int64
          description: The client's pull cursor; checked against the tombstone floor.
        works:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/WorkDescriptor' }
        records:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PushRecord' }

    PushResult:
      type: object
      required: [kind, key, result]
      properties:
        kind: { $ref: '#/components/schemas/RecordKind' }
        key: { type: string }
        result:
          type: string
          enum:
            - applied
            - unchanged
            - rejected:missing_clock
            - rejected:invalid_clock
            - rejected:invalid_record
            - rejected:clock_skew
            - rejected:invalid_key
            - rejected:unknown_work
            - rejected:quota_exceeded
        record:
          description: The merged state, present unless rejected.
          $ref: '#/components/schemas/SyncRecord'

    PushResponse:
      type: object
      required: [results, seq]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/PushResult' }
        seq:
          type: integer
          format: int64
          description: The account's latest seq after this batch.

    SyncRecord:
      type: object
      required: [kind, key, seq, fields, clocks]
      properties:
        kind: { $ref: '#/components/schemas/RecordKind' }
        key: { type: string }
        seq: { type: integer, format: int64 }
        work:
          description: Present for records keyed by a work hash, and for unit records.
          $ref: '#/components/schemas/WorkDescriptor'
        unitRemoteId: { type: string }
        fields:
          type: object
          additionalProperties: true
        clocks:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Hlc' }
        deleted: { $ref: '#/components/schemas/DeletedRegister' }
        cleared: { $ref: '#/components/schemas/Hlc' }

    ChangesResponse:
      type: object
      required: [records, nextSince, hasMore]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/SyncRecord' }
        nextSince: { type: integer, format: int64 }
        hasMore: { type: boolean }

    WebRegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[a-z0-9_]{3,32}$' }
        password: { type: string, minLength: 8, maxLength: 256 }
        email: { type: [string, 'null'], format: email }
        inviteCode: { type: [string, 'null'] }
        setupCode: { type: [string, 'null'] }
        deviceName:
          type: [string, 'null']
          maxLength: 64
          description: Shown in the device list. Defaults to a name derived from the User-Agent.

    WebLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        deviceName: { type: [string, 'null'], maxLength: 64 }

    WebTokens:
      type: object
      required: [accessToken, accessTokenExpiresAt]
      properties:
        accessToken: { type: string, description: Send as a bearer token; keep it in memory only. }
        accessTokenExpiresAt: { type: integer, format: int64, description: Unix milliseconds. }

    WebSession:
      allOf:
        - $ref: '#/components/schemas/WebTokens'
        - type: object
          required: [user, device]
          properties:
            user: { $ref: '#/components/schemas/User' }
            device: { $ref: '#/components/schemas/Device' }

    Usage:
      type: object
      required: [total, quota, byKind]
      properties:
        total: { type: integer, description: Number of stored records, tombstones included. }
        quota: { type: [integer, 'null'], description: Record limit for this account; null means unlimited. }
        byKind:
          type: object
          description: Live (not deleted) records per kind.
          additionalProperties: { type: integer }

    AccountExport:
      type: object
      required: [exportedAt, user, devices, works, records]
      properties:
        exportedAt: { type: integer, format: int64 }
        instance:
          type: object
          properties:
            name: { type: string }
            url: { type: [string, 'null'] }
        user: { $ref: '#/components/schemas/User' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/Device' }
        works:
          type: array
          description: Descriptions of the works the records refer to.
          items: { $ref: '#/components/schemas/WorkDescriptor' }
        records:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/SyncRecord'
              - type: object
                properties:
                  updatedAt: { type: integer, format: int64 }

    LibraryItem:
      type: object
      required: [key, title, local, categoryIds, pinned, archived, trackedUnits, readUnits, updatedAt]
      properties:
        key: { type: string }
        title:
          type: string
          description: The custom title, else the work title, else the title stored with a local entry.
        author: { type: [string, 'null'] }
        contentKind: { type: [string, 'null'], enum: [manga, novel, null] }
        coverUrl: { type: [string, 'null'] }
        sourceName: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
        local: { type: boolean, description: True for `local:` entries, which have no source. }
        addedAt: { type: [integer, 'null'], format: int64 }
        categoryIds:
          type: array
          items: { type: string }
        pinned: { type: boolean }
        archived: { type: boolean }
        trackedUnits: { type: integer, description: Chapters that have a synced state record. }
        readUnits: { type: integer }
        progression: { type: [number, 'null'], description: Reading position in the whole work, 0 to 1. }
        currentUnitRemoteId: { type: [string, 'null'] }
        lastReadAt: { type: [integer, 'null'], format: int64 }
        updatedAt: { type: integer, format: int64, description: When the library record last changed on the server. }

    LibraryPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LibraryItem' }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }

    LibraryUnit:
      type: object
      required: [unitRemoteId, read, bookmarked, updatedAt]
      properties:
        unitRemoteId: { type: string }
        read: { type: boolean }
        bookmarked: { type: boolean }
        lastPageIndex: { type: [integer, 'null'] }
        updatedAt: { type: integer, format: int64 }

    LibraryDetail:
      allOf:
        - $ref: '#/components/schemas/LibraryItem'
        - type: object
          required: [units]
          properties:
            work:
              oneOf:
                - $ref: '#/components/schemas/WorkDescriptor'
                - type: 'null'
            units:
              type: array
              description: Chapter states, most recently changed first (at most 5000).
              items: { $ref: '#/components/schemas/LibraryUnit' }

    Category:
      type: object
      required: [key, name, order]
      properties:
        key: { type: string }
        name: { type: string }
        order: { type: integer }

    AdminOverview:
      type: object
      required: [version, users, devices, records, works, emailAvailable]
      properties:
        version: { type: string }
        users:
          type: object
          required: [total, active, suspended, admins]
          properties:
            total: { type: integer }
            active: { type: integer }
            suspended: { type: integer }
            admins: { type: integer }
        devices: { type: integer, description: Devices that are signed in. }
        records: { type: integer }
        works: { type: integer }
        emailAvailable: { type: boolean, description: True when SMTP is configured. }

    AdminUser:
      type: object
      required: [id, username, emailVerified, role, status, createdAt, deviceCount, recordCount]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        role: { type: string, enum: [user, moderator, admin] }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: integer, format: int64 }
        lastSeenAt: { type: [integer, 'null'], format: int64 }
        deviceCount: { type: integer }
        recordCount: { type: integer }
        recordQuota: { type: [integer, 'null'], description: Per-user override; null uses the instance default. }

    AdminUserPatch:
      type: object
      minProperties: 1
      properties:
        role: { type: string, enum: [user, moderator, admin] }
        status: { type: string, enum: [active, suspended] }
        recordQuota: { type: [integer, 'null'], minimum: 0 }
        emailVerified: { type: boolean }

    Invite:
      type: object
      required: [id, maxUses, uses, createdAt]
      properties:
        id: { type: string, format: uuid }
        maxUses: { type: integer }
        uses: { type: integer }
        expiresAt: { type: [integer, 'null'], format: int64 }
        createdAt: { type: integer, format: int64 }
        createdBy: { type: [string, 'null'], description: Username; null for invites made on the command line. }
        note: { type: [string, 'null'] }

    InstanceSettings:
      type: object
      required: [name, description, registration, emailVerification, termsUrl, privacyUrl, contact]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        registration: { type: string, enum: [open, invite, closed] }
        emailVerification: { type: string, enum: [disabled, optional, required] }
        termsUrl: { type: [string, 'null'], format: uri }
        privacyUrl: { type: [string, 'null'], format: uri }
        contact: { type: [string, 'null'], maxLength: 200 }

    InstanceSettingsPatch:
      type: object
      description: Only the keys that are present change. `null` resets a key to its environment default.
      minProperties: 1
      properties:
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        registration: { type: [string, 'null'], enum: [open, invite, closed, null] }
        emailVerification: { type: [string, 'null'], enum: [disabled, optional, required, null] }
        termsUrl: { type: [string, 'null'] }
        privacyUrl: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }

    AdminSettings:
      type: object
      required: [values, defaults, overridden, emailAvailable]
      properties:
        values: { $ref: '#/components/schemas/InstanceSettings' }
        defaults: { $ref: '#/components/schemas/InstanceSettings' }
        overridden:
          type: array
          description: Keys whose value comes from the database instead of the environment.
          items: { type: string }
        emailAvailable: { type: boolean }

    AuditEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actor:
          type: [object, 'null']
          required: [id, username]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
        action: { type: string }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        detail: { type: [object, 'null'] }
        createdAt: { type: integer, format: int64 }
